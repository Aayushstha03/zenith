[project]
name = "zenith"
version = "0.1.0"
description = "Local-first Markdown knowledge index backed solely by Qdrant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed==0.7.3",
    "qdrant-client==1.15.1",
]

[project.scripts]
zenith = "zenith.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
